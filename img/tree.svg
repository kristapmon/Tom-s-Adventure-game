<svg width="100" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree trunk -->
  <rect x="40" y="100" width="20" height="50" fill="#8B4513"/>
  
  <!-- Tree foliage (triangular shape) -->
  <polygon points="50,10 10,100 90,100" fill="#006400"/>
  
  <!-- Smaller triangle on top for layered look -->
  <polygon points="50,30 20,90 80,90" fill="#008000"/>
  
  <!-- Even smaller triangle on top -->
  <polygon points="50,50 30,80 70,80" fill="#00A000"/>
</svg> 